<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Soit">
  <title>Soit</title>
  <!-- 16–32px friendly: thicker joins, same Forked Card story -->
  <rect width="32" height="32" rx="7" fill="#8b5e34"/>
  <rect x="9" y="6" width="14" height="17" rx="2.5" fill="#fffdf8"/>
  <g
    fill="none"
    stroke="#2a241c"
    stroke-width="2.4"
    stroke-linecap="round"
