  >
    <path d="M16 12 V21"/>
    <path d="M16 16.5 L21.5 21"/>
  </g>
  <circle cx="16" cy="12" r="1.7" fill="#2a241c"/>
  <circle cx="16" cy="21" r="1.55" fill="#2a241c"/>
  <circle cx="21.5" cy="21" r="1.55" fill="#2a241c"/>
</svg>
