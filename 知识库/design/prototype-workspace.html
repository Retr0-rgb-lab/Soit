<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Soit prototype — workspace chrome v5</title>
<!--
  PROTOTYPE (throwaway) v5
  Polish + motion: Explore-grade card chrome, Soit rules (deepen+diverge only).
  A Workbench · B Stack (default) · C Paper
  Motion thesis: card switch is the focal moment; hover bars / float / graph are feedback.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-soft: cubic-bezier(0.32, 0.72, 0, 1);
    --ink: #1b1916;
    --paper: #f7f2ea;
    --paper-2: #efe7da;
    --line: #6f675c;
    --muted: #7a7266;
    --bg: #d8d0c3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #1a1916; overflow: hidden; }
  #app { height: 100%; }
  button, textarea { font: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible, textarea:focus-visible {
    outline: 2px solid #1b1916; outline-offset: 2px;
  }

  .mark {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    cursor: pointer;
    border-radius: 3px;
    transition: background .15s var(--ease-soft), text-decoration-color .15s, box-shadow .15s;
  }
  .mark:hover, .mark.armed {
    background: color-mix(in srgb, currentColor 12%, transparent);
    text-decoration-color: transparent;
    box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 8%, transparent);
  }

  .switcher {
    position: fixed; right: 16px; top: 14px; left: auto; bottom: auto;
    transform: none;
    z-index: 90; display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 8px; border-radius: 999px;
    background: #111; color: #f4f4f1;
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    box-shadow: 0 12px 32px rgba(0,0,0,.4);
  }
  .switcher .sub { opacity: .55; }
  .switcher button {
    width: 28px; height: 28px; border: 0; border-radius: 999px;
    background: #2a2a28; color: #fff;
    transition: background .15s, transform .12s var(--ease-soft);
  }
  .switcher button:hover { background: #3a3a36; }
  .switcher button:active { transform: scale(.94); }
  .statebar {
    position: fixed; left: 14px; bottom: 14px; z-index: 90;
    max-width: 280px; padding: 8px 10px; border-radius: 8px;
    background: #111; color: #cfcfc8;
    font: 11px/1.45 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; pointer-events: none;
    opacity: .0; transition: opacity .2s;
  }
  body.debug .statebar { opacity: 1; }

  .press {
    position: relative;
    border: 1px solid rgba(27,25,22,.28);
    box-shadow: 0 1px 1px rgba(20,16,12,.06), 0 6px 14px rgba(20,16,12,.12);
    transform: translateY(0);
    transition: transform .12s cubic-bezier(.32,.72,0,1), box-shadow .12s;
  }
  .press:active:not(:disabled) {
    transform: translateY(1px);
    box-shadow: 0 1px 2px rgba(20,16,12,.12);
  }
  .press.ink {
    background: #1b1916; color: #f4efe6; border-color: #1b1916;
    box-shadow: 0 1px 1px rgba(20,16,12,.2), 0 10px 22px rgba(20,16,12,.22);
  }

  .tip {
    position: fixed; z-index: 130;
    max-width: 240px; padding: 6px 10px; border-radius: 8px;
    background: #1b1916; color: #f4efe6;
    border: 1px solid rgba(255,255,255,.08);
    font: 11px/1.35 Sora, ui-sans-serif, sans-serif;
    box-shadow: 0 12px 28px rgba(0,0,0,.28);
    pointer-events: none;
    opacity: 0; transform: translateY(4px);
    transition: opacity .12s, transform .12s;
  }
  .tip.on { opacity: 1; transform: translateY(0); }

  /* ════════ A ════════ */
  .A {
    height: 100%;
    display: grid;
    grid-template-columns: 220px minmax(0,1fr) 250px;
    gap: 20px;
    padding: 20px 20px 76px;
    background: #e4e8ee;
    font-family: "IBM Plex Sans", ui-sans-serif, sans-serif;
    font-size: 14px; color: #12171c;
  }
  .A .panel {
    height: 100%; background: #f6f8fb; border: 1px solid #9aa6b4;
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(40,50,62,.06), 0 14px 32px rgba(40,50,62,.12);
    padding: 16px 14px; overflow: auto;
  }
  .A .brand { font-size: 12px; letter-spacing: .16em; font-weight: 600; margin: 4px 6px 16px; }
  .A .ws {
    display: flex; align-items: center; margin: 0 0 8px; padding: 9px 12px;
    border-radius: 12px; background: #e7edf3; color: #4a5966; border: 0; width: 100%; text-align: left;
  }
  .A .ws.on {
    background: linear-gradient(180deg, #fff, #eef3f7); color: #12171c;
    box-shadow: inset 0 1px 0 #fff, 0 6px 14px rgba(40,50,62,.1);
  }
  .A .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
  .A .object {
    width: min(780px, 94%); height: min(82vh, 860px);
    display: flex; flex-direction: column;
    background: #fbf8f3; border: 1px solid #8f8578; border-radius: 18px;
    box-shadow: 0 2px 4px rgba(40,50,62,.06), 0 18px 40px rgba(40,50,62,.14), 0 40px 80px rgba(40,50,62,.10);
    padding: 22px 24px 16px;
  }
  .A .object h1 { font-size: 16px; margin: 0 0 14px; }
  .A .stream { flex: 1; overflow: auto; }
  .A .bubble {
    background: #fff; border: 1px solid #b7aea2; border-radius: 14px;
    padding: 12px 14px; margin: 0 0 12px; line-height: 1.55;
    box-shadow: 0 1px 2px rgba(40,30,20,.05), 0 8px 18px rgba(40,30,20,.08);
  }
  .A .who { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #7b8792; margin: 0 0 10px; }
  .A .composer {
    margin-top: 10px; background: #fff; border: 1px solid #8f8578; border-radius: 14px; padding: 8px;
    box-shadow: 0 1px 2px rgba(40,30,20,.06), 0 10px 24px rgba(40,30,20,.10);
  }
  .A textarea { width: 100%; border: 0; resize: none; outline: none; background: transparent; min-height: 38px; }
  .A .row { display: flex; justify-content: flex-end; gap: 8px; }
  .A .pill { border-radius: 999px; padding: 7px 13px; font-size: 12px; background: #fff; }
  .A .file {
    background: #fff; border: 1px solid #8a95a3; border-radius: 12px; padding: 10px 12px; margin: 0 0 8px;
    box-shadow: inset 0 1px 0 #fff, 0 6px 12px rgba(40,50,62,.08); font-size: 12px;
  }

  /* ════════ B Stack — interaction target ════════ */
  .B {
    height: 100%;
    display: grid;
    grid-template-columns: var(--left, 196px) minmax(0,1fr) 220px;
    background: var(--bg);
    font-family: Sora, ui-sans-serif, sans-serif;
    font-size: 14px; color: var(--ink);
    transition: grid-template-columns .32s var(--ease-out);
  }
  .B.collapsed { --left: 76px; }
  .B .left {
    padding: 22px 14px 28px;
    display: flex; flex-direction: column; gap: 6px;
    border-right: 1px solid rgba(80,70,55,.08);
    min-height: 0;
  }
  .B .logo {
    font-family: Fraunces, serif; font-size: 26px; margin: 4px 4px 18px;
    transition: font-size .25s var(--ease-out);
  }
  .B.collapsed .logo { font-size: 20px; letter-spacing: .04em; }
  .B .nav {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 12px; color: #6d665c;
    border: 0; background: transparent; width: 100%; text-align: left;
    transition: background .18s, color .18s, box-shadow .18s, transform .12s var(--ease-soft);
  }
  .B .nav:hover { background: rgba(255,252,246,.45); color: var(--ink); }
  .B .nav .ico {
    width: 28px; height: 28px; border-radius: 9px; flex: 0 0 auto;
    display: grid; place-items: center;
    background: #ebe3d6; color: #3d3830;
    box-shadow: 0 4px 10px rgba(60,45,25,.08);
  }
  .B .nav .ico svg {
    width: 15px; height: 15px; stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  .B .nav.on {
    background: linear-gradient(180deg, #f4eee4, #e6ddd0); color: var(--ink);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 8px 16px rgba(60,45,25,.08);
  }
  .B .nav .lbl {
    white-space: nowrap; overflow: hidden;
    transition: opacity .18s, max-width .28s var(--ease-out);
    max-width: 140px;
  }
  .B.collapsed .nav .lbl { opacity: 0; max-width: 0; }
  .B .sec {
    margin: 16px 4px 6px; font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: #8a8278;
    transition: opacity .2s, margin .2s, max-height .2s;
    max-height: 24px; overflow: hidden;
  }
  .B.collapsed .sec { opacity: 0; max-height: 0; margin: 0; }
  .B .proj-list { display: flex; flex-direction: column; gap: 4px; overflow: auto; min-height: 0; }
  .B .proj {
    padding: 9px 12px; border-radius: 12px; border: 1px solid transparent;
    background: transparent; width: 100%; text-align: left; color: #4a453e;
    transition: background .18s, border-color .18s, box-shadow .18s, transform .15s var(--ease-soft);
  }
  .B .proj:hover { background: rgba(255,252,246,.5); }
  .B .proj.on {
    border-color: rgba(90,80,65,.22);
    background: linear-gradient(180deg, #f7f1e7, #ebe2d4);
    box-shadow: 0 8px 16px rgba(60,45,25,.08);
  }
  .B .left .grow { flex: 1; min-height: 8px; }
  .B .left .foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }

  .B .center {
    min-width: 0; min-height: 0;
    display: grid;
    grid-template-rows: minmax(0,1fr) auto auto;
    gap: 10px;
    padding: 18px 12px 18px;
  }
  .B .stage {
    position: relative;
    width: min(880px, 100%);
    min-height: 0;
    margin: 0 auto;
    display: flex; align-items: stretch; justify-content: center;
  }
  .B .stack {
    position: relative;
    width: min(820px, 100%);
    height: 100%;
    min-height: 0;
  }
  .B .sheet {
    position: absolute; inset: 0; border-radius: 18px;
    background: #ebe4d7; border: 1px solid #8a7f70;
    pointer-events: none;
    transition: transform .45s var(--ease-out), opacity .35s;
  }
  .B .sheet.s2 { transform: translate(12px, 12px); box-shadow: 0 22px 44px rgba(40,30,18,.10); opacity: .9; }
  .B .sheet.s1 { transform: translate(6px, 6px); box-shadow: 0 16px 32px rgba(40,30,18,.11); opacity: .95; }
  .B.card-pulse .sheet.s2 { transform: translate(16px, 16px) scale(1.01); }
  .B.card-pulse .sheet.s1 { transform: translate(8px, 8px) scale(1.005); }

  .B .card-wrap {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    z-index: 2;
  }
  .B .card {
    position: relative; flex: 1; min-height: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow:
      0 2px 4px rgba(40,30,18,.06),
      0 16px 32px rgba(40,30,18,.12),
      0 40px 72px rgba(40,30,18,.14);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform-origin: 50% 40%;
  }
  .B .card.enter {
    animation: card-enter .42s var(--ease-out) both;
  }
  @keyframes card-enter {
    from { opacity: 0; transform: translateY(14px) scale(.985); filter: blur(2px); }
    to { opacity: 1; transform: none; filter: none; }
  }
  .B .card-head {
    flex: 0 0 auto;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 16px 16px 8px 20px;
    background: linear-gradient(180deg, var(--paper) 65%, rgba(247,242,234,0));
    position: relative; z-index: 5;
  }
  .B .card-head .titles { min-width: 0; }
  .B .kicker {
    font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: #8a8278; margin: 0 0 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .B h1 {
    font-family: Fraunces, serif; font-weight: 500; font-size: clamp(20px, 2.2vw, 26px);
    margin: 0; line-height: 1.2;
  }
  .B .head-tools { display: flex; gap: 8px; flex: 0 0 auto; }
  .B .round {
    width: 36px; height: 36px; border-radius: 999px; border: 0;
    background: var(--paper-2); color: #2a251f;
    display: grid; place-items: center;
    box-shadow: 0 1px 1px rgba(40,30,18,.06), 0 8px 16px rgba(40,30,18,.10);
    transition: background .15s, transform .12s var(--ease-soft), box-shadow .15s;
  }
  .B .round:hover { background: #e7dccb; transform: translateY(-1px); }
  .B .round:active { transform: translateY(0) scale(.96); }
  .B .round.danger { color: #8b2e2e; }
  .B .round svg {
    width: 18px; height: 18px; stroke: currentColor; fill: none;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }

  .B .card-body {
    position: relative; flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0,1fr) 22px;
    transition: grid-template-columns .32s var(--ease-out);
  }
  .B .card-body:hover, .B .card-body.rail-open {
    grid-template-columns: minmax(0,1fr) 156px;
  }
  .B .msgs {
    overflow: auto; padding: 2px 18px 20px 22px;
    scrollbar-width: thin;
    scrollbar-color: rgba(90,80,65,.28) transparent;
  }
  .B .turn {
    position: relative;
    margin: 0 0 14px;
    padding: 10px 10px 12px;
    border-radius: 14px;
    border: 1px solid transparent;
    transition: background .18s, border-color .18s, box-shadow .18s;
  }
  .B .turn:hover, .B .turn.focus {
    border-color: rgba(90,80,65,.14);
    background: rgba(255,252,246,.62);
  }
  .B .turn.collapsed {
    padding: 10px 12px;
    background: rgba(255,252,246,.45);
    border-color: rgba(90,80,65,.12);
    cursor: pointer;
  }
  .B .turn.collapsed:hover { background: rgba(255,252,246,.72); }
  .B .turn.collapsed .turn-body {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    visibility: hidden;
    transition: grid-template-rows .28s var(--ease-out), opacity .2s, margin .2s, visibility .2s;
    margin: 0; overflow: hidden;
    pointer-events: none;
  }
  .B .turn:not(.collapsed) .turn-body {
    display: grid;
    grid-template-rows: 1fr;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .B .turn-body > .turn-inner { min-height: 0; overflow: hidden; }
  .B .turn-top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 4px; min-height: 36px;
  }
  .B .turn.collapsed .turn-top { margin-bottom: 0; }
  .B .turn-label {
    font-size: 12px; color: var(--muted); letter-spacing: .02em;
  }
  .B .turn-label .hint { opacity: .65; }
  .B .turn-bar {
    display: flex; align-items: center; gap: 4px;
    padding: 4px; border-radius: 999px;
    background: #f3ece2;
    border: 1px solid rgba(90,80,65,.16);
    box-shadow: 0 10px 22px rgba(40,30,18,.12);
    opacity: 0; pointer-events: none;
    transform: translateY(4px) scale(.98);
    transition: opacity .16s var(--ease-soft), transform .18s var(--ease-out);
  }
  .B .turn:hover .turn-bar, .B .turn.focus .turn-bar {
    opacity: 1; pointer-events: auto; transform: none;
  }
  .B .turn.collapsed .turn-bar { display: none; }
  .B .turn-bar .round { width: 32px; height: 32px; box-shadow: none; background: transparent; }
  .B .turn-bar .round:hover { background: #e7dccb; }
  .B .turn-bar .sep { width: 1px; height: 18px; background: rgba(90,80,65,.18); margin: 0 2px; }

  .B .msg { margin: 0 0 12px; line-height: 1.65; position: relative; }
  .B .msg.you {
    margin-left: auto; max-width: min(70%, 420px);
    background: #ebe3d6; color: #3d3830;
    border-radius: 16px 16px 6px 16px;
    padding: 10px 14px;
    width: fit-content;
    box-shadow: 0 4px 12px rgba(40,30,18,.06);
  }
  .B .msg.you .ucopy {
    position: absolute; left: -30px; top: 50%; transform: translateY(-50%);
    opacity: 0; transition: opacity .14s, transform .14s var(--ease-soft);
    width: 24px; height: 24px; border: 0; border-radius: 999px;
    background: var(--paper-2); display: grid; place-items: center; color: #4a453e;
  }
  .B .msg.you .ucopy svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .B .msg.you:hover .ucopy { opacity: 1; }
  .B .msg.ai {
    color: var(--ink); padding: 2px 8px 2px 36px; position: relative;
  }
  .B .think {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); margin: 0 0 10px 36px;
    border: 0; background: transparent; padding: 0;
  }
  .B .think svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; transition: transform .2s var(--ease-out); }
  .B .think.open svg { transform: rotate(180deg); }
  .B .think-body {
    font-size: 12px; color: #6b645c; line-height: 1.5;
    margin: -2px 0 12px 36px; padding: 0 10px;
    border-radius: 10px; background: rgba(0,0,0,.03);
    display: grid; grid-template-rows: 0fr; opacity: 0;
    transition: grid-template-rows .28s var(--ease-out), opacity .2s, padding .2s;
    overflow: hidden;
  }
  .B .think-body > span { min-height: 0; overflow: hidden; display: block; }
  .B .think-body.open {
    grid-template-rows: 1fr; opacity: 1; padding: 8px 10px;
  }

  .B .copybar {
    position: absolute; left: 0; top: 4px;
    display: flex; flex-direction: column; gap: 4px;
    padding: 4px; border-radius: 999px;
    background: #f3ece2; border: 1px solid rgba(90,80,65,.16);
    box-shadow: 0 10px 22px rgba(40,30,18,.12);
    z-index: 6;
    opacity: 0; pointer-events: none;
    transform: translateX(-4px);
    transition: opacity .15s, transform .18s var(--ease-out);
  }
  .B .msg.ai:hover .copybar {
    opacity: 1; pointer-events: auto; transform: none;
  }
  .B .copybar .round { width: 28px; height: 28px; box-shadow: none; background: transparent; }
  .B .copybar .round:hover { background: #e7dccb; }

  .B .rail {
    overflow: hidden;
    border-left: 1px solid rgba(90,80,65,.08);
    background: linear-gradient(90deg, transparent, rgba(255,252,246,.45));
    display: flex; flex-direction: column; align-items: stretch;
    padding: 10px 0;
    min-width: 0;
  }
  .B .rail-item {
    border: 0; background: transparent; text-align: right;
    padding: 8px 10px; color: var(--muted); font-size: 11px; line-height: 1.35;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color .15s, background .15s, padding .25s var(--ease-out);
  }
  .B .rail-item:hover { color: var(--ink); background: rgba(255,252,246,.55); }
  .B .rail-item.on { color: var(--ink); font-weight: 600; }
  .B .rail-item .hint {
    display: block; font-size: 10px; opacity: .55; margin-bottom: 2px;
    transition: opacity .2s;
  }
  .B .card-body:not(:hover):not(.rail-open) .rail-item {
    font-size: 0; padding: 12px 0; text-align: center;
  }
  .B .card-body:not(:hover):not(.rail-open) .rail-item .hint { opacity: 0; height: 0; margin: 0; overflow: hidden; }
  .B .card-body:not(:hover):not(.rail-open) .rail-item::after {
    content: ""; display: block; width: 7px; height: 7px; border-radius: 999px;
    background: #b7aea2; margin: 0 auto;
    transition: transform .18s, background .18s;
  }
  .B .card-body:not(:hover):not(.rail-open) .rail-item.on::after {
    background: var(--ink); transform: scale(1.2);
  }

  .B .edge-btns {
    width: min(820px, 100%);
    margin: 0 auto;
    display: flex; justify-content: center; gap: 96px;
    padding: 2px 0 0;
    z-index: 4;
  }
  .B .edge-btns .round {
    width: 40px; height: 40px;
    background: var(--paper);
    border: 1px solid rgba(111,103,92,.35);
  }

  .B .dock {
    width: min(820px, 100%);
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 10px 12px;
    display: flex; align-items: flex-end; gap: 10px;
    box-shadow: 0 2px 4px rgba(40,30,18,.06), 0 18px 36px rgba(40,30,18,.14);
    z-index: 8;
  }
  .B .dock .model {
    flex: 0 0 auto; border: 0; background: var(--paper-2); border-radius: 999px;
    padding: 8px 12px; font-size: 12px; color: #3d3830;
    box-shadow: 0 4px 10px rgba(40,30,18,.08);
    transition: background .15s;
  }
  .B .dock .model:hover { background: #e7dccb; }

<body>
<div id="app"></div>
<pre class="statebar" id="state"></pre>
<div class="tip" id="tip"></div>
<div class="switcher" id="switcher">
  <button type="button" data-dir="-1" aria-label="prev">←</button>
  <div><b id="sw-key">B</b> <span class="sub" id="sw-name">Stack</span></div>
  <button type="button" data-dir="1" aria-label="next">→</button>
</div>
<script>
const VARIANTS = [
  { key: "A", name: "Workbench" },
  { key: "B", name: "Stack" },
  { key: "C", name: "Paper" },
];

/** Inquiry graph — Soit: deepen (child) + diverge only */
const NODES = [
  { id: "c1", title: "线性代数基础", x: 84, y: 220, parent: null, kind: "root", unread: false },
  { id: "c2", title: "范畴论入门", x: 84, y: 140, parent: "c1", kind: "deepen", unread: false },
  { id: "c3", title: "函子", x: 84, y: 60, parent: "c2", kind: "deepen", unread: false },
  { id: "c4", title: "自然变换", x: 150, y: 60, parent: "c2", kind: "diverge", unread: true },
  { id: "c5", title: "伴随", x: 20, y: 60, parent: "c2", kind: "diverge", unread: false },
];

const TURNS = {
  c3: [
    {
      id: "t0",
      title: "开场",
      collapsed: true,
      user: "从线性代数过来，先对一下词。",
      think: "对齐背景：向量空间 → 范畴语言。",
      thinkOpen: false,
      ai: "先把对象和态射分开。后面的「函子」只在这两个词站稳之后再谈。",
    },
    {
      id: "t1",
      title: "函子在保什么",
      collapsed: false,
      user: "函子到底在保什么结构？",
      think: "回答要可分叉：函子 / 范畴 / 自然变换 分开。",
      thinkOpen: false,
      ai: "一个<span class=\"mark\" data-term=\"函子\">函子</span>把一个<span class=\"mark\" data-term=\"范畴\">范畴</span>里的对象和态射送到另一个范畴，并保住复合与单位。点下划线先选<strong>深挖</strong>或<strong>发散</strong>；不要和<span class=\"mark\" data-term=\"自然变换\">自然变换</span>搅在一起。重生只在本轮，不长新卡。",
    },
  ],
  c1: [
    { id: "t0", title: "根卡", collapsed: false, user: "从线性代数开始。", think: "", thinkOpen: false, ai: "这是宇宙根探究。从这里深挖会进入范畴论。" },
  ],
  c2: [
    { id: "t0", title: "入门", collapsed: false, user: "范畴论怎么接上线性代数？", think: "", thinkOpen: false, ai: "对象 ≈ 结构，态射 ≈ 保结构映射。下一步是<span class=\"mark\" data-term=\"函子\">函子</span>。" },
  ],
  c4: [
    { id: "t0", title: "平行线", collapsed: false, user: "自然变换是另一条线。", think: "", thinkOpen: false, ai: "发散卡：空白对话 + 回边。父卡「范畴论入门」仍活着。" },
  ],
  c5: [
    { id: "t0", title: "平行线", collapsed: false, user: "伴随呢？", think: "", thinkOpen: false, ai: "又一条发散。树是关系，不是强制暂停父卡。" },
  ],
};

const state = {
  variant: "B",
  leftCollapsed: false,
  focusId: "c3",
  turns: typeof structuredClone === "function" ? structuredClone(TURNS) : JSON.parse(JSON.stringify(TURNS)),
  chooser: null,
  float: null,
  selectionBar: null,
  quote: "",
  draft: "",
  lastAction: "open",
  bookmarked: new Set(),
  tipTimer: 0,
  animCard: false,
  scrollTop: 0,
  debug: new URL(location.href).searchParams.get("debug") === "1",
};
if (state.debug) document.body.classList.add("debug");

const $ = (id) => document.getElementById(id);
const node = (id) => NODES.find((n) => n.id === id);
const focusTitle = () => node(state.focusId)?.title || "";
function pathText() {
  const parts = [];
  let cur = node(state.focusId);
  while (cur) { parts.unshift(cur.title); cur = cur.parent ? node(cur.parent) : null; }
  return parts.join(" → ");
}
function turnsOf(id = state.focusId) {
  if (!state.turns[id]) state.turns[id] = [];
  return state.turns[id];
}

function setVariant(key) {
  state.variant = key;
  state.chooser = null;
  state.float = null;
  state.selectionBar = null;
  hideTip(true);
  const url = new URL(location.href);
  url.searchParams.set("variant", key);
  history.replaceState(null, "", url);
  render();
}
function cycle(dir) {
  const idx = VARIANTS.findIndex((v) => v.key === state.variant);
  setVariant(VARIANTS[(idx + dir + VARIANTS.length) % VARIANTS.length].key);
}
function paintState() {
  const el = $("state");
  if (!el) return;
  el.textContent =
    `variant  ${state.variant}\n` +
    `focus    ${focusTitle()}\n` +
    `path     ${pathText()}\n` +
    `action   ${state.lastAction}\n` +
    `chooser  ${state.chooser ? (state.chooser.term || state.chooser.selection || "—") : "—"}\n` +
    `quote    ${state.quote ? "yes" : "no"}\n` +
    `draft    ${state.draft ? "yes" : "no"}`;
  const meta = VARIANTS.find((v) => v.key === state.variant);
  $("sw-key").textContent = meta.key;
  $("sw-name").textContent = meta.name;
}

/* ── tooltips ── */
function hideTip(immediate) {
  clearTimeout(state.tipTimer);
  const tip = $("tip");
  if (!tip) return;
  tip.classList.remove("on");
  if (immediate) tip.textContent = "";
}
function scheduleTip(el, text, delay = 480) {
  hideTip(true);
  if (!text || !el) return;
  clearTimeout(state.tipTimer);
  state.tipTimer = setTimeout(() => {
    const tip = $("tip");
    const r = el.getBoundingClientRect();
    tip.textContent = text;
    tip.classList.add("on");
    const tw = tip.offsetWidth || 120;
    const th = tip.offsetHeight || 28;
    let left = r.left + r.width / 2 - tw / 2;
    let top = r.top - th - 8;
    if (top < 8) top = r.bottom + 8;
    left = Math.max(8, Math.min(left, innerWidth - tw - 8));
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }, delay);
}

/* ── icons ── */
const I = {
  deepen: `<svg viewBox="0 0 24 24"><path d="M9 9H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-4"/><path d="M15 7v4M13 9h4"/><path d="M15 3h4a2 2 0 0 1 2 2v4"/></svg>`,
  diverge: `<svg viewBox="0 0 24 24"><path d="M4 5h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4"/><path d="M20 5h-6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h6"/><path d="M17 10v4M15 12h4"/></svg>`,
  bookmark: `<svg viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
  trash: `<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`,
  refresh: `<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>`,
  copy: `<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  md: `<svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6"/><path d="M8 6l-6 6 6 6"/></svg>`,
  quote: `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01M12 10h.01"/></svg>`,
  preview: `<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>`,
  send: `<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>`,
  chev: `<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`,
  x: `<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>`,
  panel: `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>`,
  vault: `<svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>`,
  mem: `<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  skill: `<svg viewBox="0 0 24 24"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3z"/></svg>`,
};

function roundBtn(action, tip, icon, extraClass = "") {
  return `<button type="button" class="round ${extraClass}" data-action="${action}" data-tip="${tip}" aria-label="${tip}">${icon}</button>`;
}

/* ── actions ── */
function layoutGraph() {
  // Stable tree layout in viewBox 0..200 x 0..300 (y grows down from root)
  const byParent = new Map();
  NODES.forEach((n) => {
    const k = n.parent || "__root__";
    if (!byParent.has(k)) byParent.set(k, []);
    byParent.get(k).push(n);
  });
  const roots = NODES.filter((n) => !n.parent);
  const depthOf = (n, guard = 0) => {
    if (!n.parent || guard > 20) return 0;
    const p = node(n.parent);
    return 1 + (p ? depthOf(p, guard + 1) : 0);
  };
  const leaves = [];
  const walk = (n) => {
    const kids = byParent.get(n.id) || [];
    if (!kids.length) leaves.push(n);
    else kids.forEach(walk);
  };
  roots.forEach(walk);
  leaves.forEach((n, i) => { n._lx = i; });
  const assign = (n) => {
    const kids = byParent.get(n.id) || [];
    if (!kids.length) return n._lx;
    let sum = 0;
    kids.forEach((k) => { sum += assign(k); });
    n._lx = sum / kids.length;
    return n._lx;
  };
  roots.forEach(assign);
  const maxL = Math.max(1, leaves.length - 1);
  const maxD = Math.max(1, ...NODES.map((n) => depthOf(n)));
  NODES.forEach((n) => {
    const d = depthOf(n);
    n.x = 28 + ((n._lx ?? 0) / maxL) * 144;
    n.y = 36 + (d / maxD) * 220;
  });
}

function focusNode(id) {
  if (!node(id) || id === state.focusId) {
    if (id === state.focusId) { state.lastAction = "focus same"; paintState(); }
    return;
  }
  rememberScroll();
  state.focusId = id;
  state.lastAction = "focus " + id;
  state.chooser = null;
  state.float = null;
  state.selectionBar = null;
  state.animCard = true;
  const n = node(id);
  if (n) n.unread = false;
  render();
}

function spawn(kind, sourceLabel) {
  const label = sourceLabel || state.chooser?.term || state.chooser?.selection || "概念";
  const parent = state.focusId;
  const id = "c" + (NODES.length + 1);
  NODES.push({
    id,
    title: (kind === "deepen" ? "深挖 · " : "发散 · ") + String(label).slice(0, 12),
    x: 0, y: 0,
    parent,
    kind,
    unread: true,
  });
  layoutGraph();
  state.turns[id] = [{
    id: "t0",
    title: kind === "deepen" ? "深挖开场" : "发散开场",
    collapsed: false,
    user: kind === "deepen"
      ? `从「${label}」往下：它具体指什么？`
      : `另开一条：和「${label}」平行的问题。`,
    think: kind === "deepen"
      ? "深挖：父状态 + 源跨度 + 为何跳下；不整段灌父 transcript。"
      : "发散：空白对话 + 回边；父卡继续活。",
    thinkOpen: false,
    ai: kind === "deepen"
      ? `这是对「${label}」的深挖卡。作用域上下文已带上；需要更多父卡内容时再读。`
      : `这是平行发散。回边指向源卡里的「${label}」。`,
  }];
  state.lastAction = `${kind} ← ${label} → ${id}`;
  state.chooser = null;
  state.float = null;
  state.selectionBar = null;
  state.focusId = id;
  state.animCard = true;
  state.scrollTop = 0;
  render();
}

function rememberScroll() {
  const msgs = $("msgs");
  if (msgs) state.scrollTop = msgs.scrollTop;
}

function openChooser(payload) {
  state.chooser = payload;
  state.float = null;
  state.selectionBar = null;
  state.lastAction = "choose:" + (payload.term || payload.selection || "");
  render();
}

function openFloat(term, clientX, clientY) {
  const body = {
    "函子": "范畴之间的映射：对象→对象，态射→态射，保住复合与单位。",
    "范畴": "对象 + 态射 + 复合 + 单位。线性代数里的向量空间与线性映射是例子。",
    "自然变换": "函子之间的态射。先站稳函子，再谈这一层。",
  }[term] || `「${term}」的本地预览（demo）。选深挖继续下钻，或发散平行开一条。`;
  state.float = {
    term,
    x: Math.min(clientX + 12, innerWidth - 440),
    y: Math.min(clientY + 12, innerHeight - 280),
    body,
  };
  state.chooser = null;
  state.selectionBar = null;
  state.lastAction = "preview:" + term;
  render();
}

function regenerateTurn(turnId) {
  const list = turnsOf();
  const t = list.find((x) => x.id === turnId);
  if (!t) return;
  rememberScroll();
  t.ai = "（重来）" + t.ai.replace(/^（重来）/, "");
  t.think = "同卡内再生成，不建树节点。";
  state.lastAction = "regenerate " + turnId;
  render();
}

function deleteTurn(turnId) {
  const list = turnsOf();
  if (list.length <= 1) {
    state.lastAction = "keep last turn";
    paintState();
    return;
  }
  rememberScroll();
  state.turns[state.focusId] = list.filter((t) => t.id !== turnId);
  state.lastAction = "delete turn " + turnId;
  render();
}

function toggleBookmarkCard() {
  if (state.bookmarked.has(state.focusId)) state.bookmarked.delete(state.focusId);
  else state.bookmarked.add(state.focusId);
  state.lastAction = "bookmark card " + state.focusId;
  paintState();
  // light update: toggle head button tip only via full render is ok
  render();
}

function sendDraft() {
  const text = state.draft.trim();
  if (!text && !state.quote) return;
  const list = turnsOf();
  list.forEach((t) => { t.collapsed = true; });
  const content = (state.quote ? `「引用」${state.quote}\n\n` : "") + text;
  list.push({
    id: "t" + Date.now(),
    title: text.slice(0, 16) || "引用追问",
    collapsed: false,
    user: content,
    think: "demo 回复",
    thinkOpen: false,
    ai: "已记在本卡对话路径里。点下划线的<span class=\"mark\" data-term=\"函子\">函子</span>可继续分叉。",
  });
  state.draft = "";
  state.quote = "";
  state.lastAction = "send";
  state.scrollTop = 1e9;
  render();
}

function copyText(text, label) {
  const done = () => { state.lastAction = label || "copy"; paintState(); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
  else done();
}

function pathOnFocus(id) {
  const ids = new Set();
  let cur = node(id);
  while (cur) { ids.add(cur.id); if (cur.parent) ids.add(cur.parent + ">" + cur.id); cur = cur.parent ? node(cur.parent) : null; }
  return ids;
}

function graphSvg() {
  layoutGraph();
  const hot = pathOnFocus(state.focusId);
  const edges = NODES.filter((n) => n.parent).map((n) => {
    const p = node(n.parent);
    if (!p) return "";
    const midY = (p.y + n.y) / 2;
    const isHot = hot.has(n.parent + ">" + n.id);
    return `<path class="edge ${isHot ? "hot" : ""}" d="M${p.x.toFixed(1)} ${p.y.toFixed(1)} C${p.x.toFixed(1)} ${midY.toFixed(1)}, ${n.x.toFixed(1)} ${midY.toFixed(1)}, ${n.x.toFixed(1)} ${n.y.toFixed(1)}" />`;
  }).join("");
  const dots = NODES.map((n) => {
    const on = n.id === state.focusId;
    const r = on ? 12 : 8.5;
    return `<g class="n ${on ? "on" : ""} ${n.unread ? "unread" : ""}" data-focus="${n.id}">
      <circle class="ring" cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${r}" />
      <circle class="dot" cx="${(n.x + r - 1).toFixed(1)}" cy="${(n.y - r + 1).toFixed(1)}" r="3.2" />
      <title>${escapeHtml(n.title)}</title>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">${edges}${dots}</svg>`;
}

function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function escapeHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "&#39;"); }

function render() {
  hideTip(true);
  const app = $("app");
  app.innerHTML =
    state.variant === "A" ? renderA() :
    state.variant === "C" ? renderC() :
    renderB();
  paintState();
  bindDynamic();
  const msgs = $("msgs");
  if (msgs) {
    const top = state.scrollTop;
    requestAnimationFrame(() => {
      msgs.scrollTop = top >= 1e8 ? msgs.scrollHeight : top;
      if (state.scrollTop >= 1e8) state.scrollTop = msgs.scrollTop;
    });
  }
  if (state.animCard) {
    // one-shot pulse/enter
    requestAnimationFrame(() => {
      setTimeout(() => {
        state.animCard = false;
        document.querySelector(".B")?.classList.remove("card-pulse");
        document.getElementById("main-card")?.classList.remove("enter");
      }, 480);
    });
  }
}

function bindDynamic() {
  const draft = $("draft");
  if (draft) {
    draft.addEventListener("input", () => {
      state.draft = draft.value;
      paintState();
      draft.style.height = "auto";
      draft.style.height = Math.min(120, draft.scrollHeight) + "px";
    });
    draft.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendDraft();
      }
    });
  }
  const msgs = $("msgs");
  if (msgs) {
    msgs.addEventListener("scroll", () => { state.scrollTop = msgs.scrollTop; }, { passive: true });
    msgs.addEventListener("mouseup", () => {
      if (state.variant !== "B") return;
      const sel = window.getSelection();
      const text = sel && String(sel.toString() || "").trim();
      if (!text || text.length < 2) {
        if (state.selectionBar) {
          state.selectionBar = null;
          // keep selection clear bar without full wipe of draft focus
          document.querySelector(".selbar")?.remove();
          paintState();
        }
        return;
      }
      const anchor = sel.anchorNode && (sel.anchorNode.nodeType === 3 ? sel.anchorNode.parentElement : sel.anchorNode);
      if (!anchor || !anchor.closest?.(".ai-html")) return;
      const r = sel.getRangeAt(0).getBoundingClientRect();
      if (!r.width && !r.height) return;
      state.selectionBar = {
        text,
        x: Math.min(innerWidth - 56, r.right + 8),
        y: Math.max(8, r.top + r.height / 2 - 40),
      };
      state.chooser = null;
      state.float = null;
      state.lastAction = "select:" + text.slice(0, 20);
      rememberScroll();
      render();
    });
  }
}

/* ── events ── */
$("switcher").addEventListener("click", (e) => {
  if (e.target.dataset.dir) cycle(Number(e.target.dataset.dir));
});

document.addEventListener("pointerover", (e) => {
  const el = e.target.closest?.("[data-tip]");
  if (el) scheduleTip(el, el.getAttribute("data-tip"));
});
document.addEventListener("pointerout", (e) => {
  const el = e.target.closest?.("[data-tip]");
  if (el) hideTip();
});

document.addEventListener("click", (e) => {
  const t = e.target;

  // marks
  const mark = t.closest?.(".mark");
  if (mark) {
    e.preventDefault();
    openFloat(mark.getAttribute("data-term") || mark.textContent, e.clientX, e.clientY);
    return;
  }

  const focus = t.closest?.("[data-focus]");
  if (focus) { focusNode(focus.getAttribute("data-focus")); return; }

  const expand = t.closest?.("[data-turn-expand]");
  if (expand && !t.closest?.("[data-action]")) {
    const id = expand.getAttribute("data-turn-expand");
    rememberScroll();
    turnsOf().forEach((x) => { x.collapsed = x.id !== id; });
    state.lastAction = "expand " + id;
    render();
    return;
  }

  const actionEl = t.closest?.("[data-action]");
  if (!actionEl) {
    // click outside closes float/chooser/sel
    if (!t.closest?.(".float") && !t.closest?.(".chooser") && !t.closest?.(".selbar")) {
      let dirty = false;
      if (state.chooser) { state.chooser = null; dirty = true; }
      if (state.float && !t.closest?.(".mark")) { state.float = null; dirty = true; }
      if (state.selectionBar && !t.closest?.(".ai-html")) { state.selectionBar = null; dirty = true; }
      if (dirty) { rememberScroll(); render(); }
    }
    return;
  }

  const action = actionEl.getAttribute("data-action");
  const turnEl = actionEl.closest?.("[data-turn]");
  const turnId = turnEl?.getAttribute("data-turn");
  const source =
    actionEl.getAttribute("data-source") ||
    actionEl.closest?.("[data-source]")?.getAttribute("data-source") ||
    state.float?.term ||
    state.chooser?.term ||
    state.chooser?.selection ||
    state.selectionBar?.text ||
    focusTitle();

  switch (action) {
    case "toggle-left":
      state.leftCollapsed = !state.leftCollapsed;
      state.lastAction = "sidebar " + (state.leftCollapsed ? "collapse" : "expand");
      // no full content wipe needed but simplest is render
      render();
      break;
    case "spawn-deepen":
      spawn("deepen", source);
      break;
    case "spawn-diverge":
      spawn("diverge", source);
      break;
    case "bookmark-card":
      toggleBookmarkCard();
      break;
    case "bookmark-turn":
      {
        const key = state.focusId + ":" + turnId;
        if (state.bookmarked.has(key)) state.bookmarked.delete(key);
        else state.bookmarked.add(key);
        state.lastAction = "bookmark turn " + turnId;
        render();
      }
      break;
    case "regen-turn":
      regenerateTurn(turnId);
      break;
    case "del-turn":
      deleteTurn(turnId);
      break;
    case "toggle-think":
      {
        const t2 = turnsOf().find((x) => x.id === actionEl.getAttribute("data-turn"));
        if (t2) {
          t2.thinkOpen = !t2.thinkOpen;
          state.lastAction = "think";
          // local DOM update to keep hover bars stable
          actionEl.classList.toggle("open", t2.thinkOpen);
          actionEl.innerHTML = `思考${t2.thinkOpen ? "收起" : "完成"} ${I.chev}`;
          const body = actionEl.nextElementSibling;
          if (body?.classList.contains("think-body")) body.classList.toggle("open", t2.thinkOpen);
          paintState();
        }
      }
      break;
    case "copy":
      copyText(actionEl.getAttribute("data-text") || actionEl.closest(".msg")?.innerText || "", "copy text");
      break;
    case "copy-md":
      {
        const html = actionEl.closest(".msg.ai")?.querySelector(".ai-html")?.innerText || "";
        copyText(html, "copy markdown");
      }
      break;
    case "send":
      sendDraft();
      break;
    case "clear-quote":
      state.quote = "";
      state.lastAction = "clear quote";
      render();
      break;
    case "close-float":
      state.float = null;
      state.lastAction = "close float";
      render();
      break;
    case "sel-preview":
      if (state.selectionBar?.text) {
        openChooser({
          selection: state.selectionBar.text,
          x: state.selectionBar.x,
          y: state.selectionBar.y,
          mode: "sel",
        });
      }
      break;
    case "sel-quote":
      if (state.selectionBar?.text) {
        state.quote = state.selectionBar.text;
        state.selectionBar = null;
        state.lastAction = "quote";
        render();
        $("draft")?.focus();
      }
      break;
    case "sel-copy":
      if (state.selectionBar?.text) copyText(state.selectionBar.text, "copy selection");
      break;
    case "noop":
      state.lastAction = "noop";
      paintState();
      break;
    default:
      break;
  }
});

document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
  if (e.key === "Escape") {
    state.chooser = null;
    state.float = null;
    state.selectionBar = null;
    hideTip(true);
    render();
  }
});

// mark hover arming
document.addEventListener("pointerover", (e) => {
  const m = e.target.closest?.(".mark");
  if (m) m.classList.add("armed");
});
document.addEventListener("pointerout", (e) => {
  const m = e.target.closest?.(".mark");
  if (m) m.classList.remove("armed");
});

layoutGraph();
const start = new URL(location.href).searchParams.get("variant") || "B";
state.variant = VARIANTS.some((v) => v.key === start) ? start : "B";
render();
</script>
</body>
</html>
